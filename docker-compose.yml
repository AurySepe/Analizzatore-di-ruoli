services:
  postgres:
    image: postgres:16-alpine
    container_name: analizzatore_postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: analizzatore_ruoli
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d analizzatore_ruoli"]
      interval: 5s
      timeout: 5s
      retries: 5

  ollama:
    image: ollama/ollama:latest
    container_name: analizzatore_ollama
    restart: always
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama

  minio:
    image: quay.io/minio/minio:latest
    container_name: analizzatore_minio
    restart: always
    command: minio server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data

  backend-api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: analizzatore_backend_api
    restart: always
    command: npm run startAndMigrate
    environment:
      DATABASE_URL: "postgresql://postgres:postgres@postgres:5432/analizzatore_ruoli?schema=public"
      LOCAL_AI_BASE_URL: "http://ollama:11434"
      PORT: 3000
      S3_ENDPOINT: "http://minio:9000"
      S3_ACCESS_KEY: "minioadmin"
      S3_SECRET_KEY: "minioadmin"
      S3_BUCKET_NAME: "resumes"
      S3_REGION: "local"
      S3_FORCE_PATH_STYLE: "true"
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_started

  backend-extractor:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: analizzatore_backend_extractor
    restart: always
    command: npm run start:extractor
    environment:
      DATABASE_URL: "postgresql://postgres:postgres@postgres:5432/analizzatore_ruoli?schema=public"
    depends_on:
      postgres:
        condition: service_healthy

  backend-evaluator:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: analizzatore_backend_evaluator
    restart: always
    command: npm run start:evaluator
    environment:
      DATABASE_URL: "postgresql://postgres:postgres@postgres:5432/analizzatore_ruoli?schema=public"
      LOCAL_AI_BASE_URL: "http://ollama:11434"
    depends_on:
      postgres:
        condition: service_healthy
      ollama:
        condition: service_started

volumes:
  postgres_data:
  ollama_data:
  minio_data:

