services:
  postgres:
    image: postgres:16-alpine
    container_name: analizzatore_postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: analizzatore_ruoli
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d analizzatore_ruoli"]
      interval: 5s
      timeout: 5s
      retries: 5

  ollama:
    image: ollama/ollama:latest
    container_name: analizzatore_ollama
    restart: always
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama

  backend-api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: analizzatore_backend_api
    restart: always
    command: npm run startAndMigrate
    environment:
      DATABASE_URL: "postgresql://postgres:postgres@postgres:5432/analizzatore_ruoli?schema=public"
      LOCAL_AI_BASE_URL: "http://ollama:11434"
      PORT: 3000
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy

  backend-extractor:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: analizzatore_backend_extractor
    restart: always
    command: npm run start:extractor
    environment:
      DATABASE_URL: "postgresql://postgres:postgres@postgres:5432/analizzatore_ruoli?schema=public"
    depends_on:
      postgres:
        condition: service_healthy

  backend-evaluator:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: analizzatore_backend_evaluator
    restart: always
    command: npm run start:evaluator
    environment:
      DATABASE_URL: "postgresql://postgres:postgres@postgres:5432/analizzatore_ruoli?schema=public"
      LOCAL_AI_BASE_URL: "http://ollama:11434"
    depends_on:
      postgres:
        condition: service_healthy
      ollama:
        condition: service_started

volumes:
  postgres_data:
  ollama_data:
