apiVersion: batch/v1
kind: Job
metadata:
  name: db-migration-job
  labels:
    app: db-migration-job
    app.kubernetes.io/name: db-migration-job
    app.kubernetes.io/component: database
spec:
  ttlSecondsAfterFinished: 60
  backoffLimit: 3
  template:
    metadata:
      labels:
        app: db-migration-job
    spec:
      restartPolicy: OnFailure
      containers:
        - name: prisma-migrate
          image: analizzatore-registry.localhost:5000/api:latest
          imagePullPolicy: Always
          command:
            - /bin/sh
            - -c
            - "cd /app/packages/database && npm run prisma:migrate:deploy"
          envFrom:
            - configMapRef:
                name: app-config
            - secretRef:
                name: app-secrets
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
