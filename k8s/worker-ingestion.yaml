apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker-ingestion
  labels:
    app: worker-ingestion
    app.kubernetes.io/name: worker-ingestion
    app.kubernetes.io/component: ingestion
    app.kubernetes.io/part-of: analizzatore-di-ruoli
spec:
  replicas: 1
  selector:
    matchLabels:
      app: worker-ingestion
  template:
    metadata:
      labels:
        app: worker-ingestion
    spec:
      containers:
        - name: worker-ingestion
          image: analizzatore-registry.localhost:5000/worker-ingestion:latest
          imagePullPolicy: Always
          envFrom:
            - configMapRef:
                name: app-config
            - secretRef:
                name: app-secrets
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
