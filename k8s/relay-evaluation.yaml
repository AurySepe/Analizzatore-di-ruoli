apiVersion: apps/v1
kind: Deployment
metadata:
  name: relay-evaluation
  labels:
    app: relay-evaluation
    app.kubernetes.io/name: relay-evaluation
    app.kubernetes.io/component: relay
spec:
  replicas: 1
  selector:
    matchLabels:
      app: relay-evaluation
  template:
    metadata:
      labels:
        app: relay-evaluation
    spec:
      containers:
        - name: relay-evaluation
          image: analizzatore-registry.localhost:5000/relay-evaluation:latest
          imagePullPolicy: Always
          envFrom:
            - configMapRef:
                name: app-config
            - secretRef:
                name: app-secrets
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 250m
              memory: 256Mi
