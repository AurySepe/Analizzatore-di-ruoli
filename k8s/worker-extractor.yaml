apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend-extractor
  labels:
    app: backend-extractor
    app.kubernetes.io/name: backend-extractor
    app.kubernetes.io/component: worker
spec:
  replicas: 1
  selector:
    matchLabels:
      app: backend-extractor
  template:
    metadata:
      labels:
        app: backend-extractor
    spec:
      containers:
        - name: backend-extractor
          image: analizzatore-registry.localhost:5000/backend:latest
          imagePullPolicy: Always
          command: ["node", "dist/src/apps/extractor-worker/main"]
          envFrom:
            - configMapRef:
                name: app-config
            - secretRef:
                name: app-secrets
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
