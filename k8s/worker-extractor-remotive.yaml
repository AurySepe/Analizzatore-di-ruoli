apiVersion: apps/v1
kind: Deployment
metadata:
  name: extractor-remotive
  labels:
    app: extractor-remotive
    app.kubernetes.io/name: extractor-remotive
    app.kubernetes.io/component: extractor
spec:
  replicas: 1
  selector:
    matchLabels:
      app: extractor-remotive
  template:
    metadata:
      labels:
        app: extractor-remotive
    spec:
      containers:
        - name: extractor-remotive
          image: analizzatore-registry.localhost:5000/extractor-remotive:latest
          imagePullPolicy: Always
          envFrom:
            - configMapRef:
                name: app-config
            - secretRef:
                name: app-secrets
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 300m
              memory: 256Mi
