apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend-evaluator
  labels:
    app: backend-evaluator
    app.kubernetes.io/name: backend-evaluator
    app.kubernetes.io/component: worker
spec:
  replicas: 1
  selector:
    matchLabels:
      app: backend-evaluator
  template:
    metadata:
      labels:
        app: backend-evaluator
    spec:
      containers:
        - name: backend-evaluator
          image: analizzatore-registry.localhost:5000/worker-evaluator:latest
          imagePullPolicy: Always
          envFrom:
            - configMapRef:
                name: app-config
            - secretRef:
                name: app-secrets
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
