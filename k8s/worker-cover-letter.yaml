apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker-cover-letter
  labels:
    app: worker-cover-letter
    app.kubernetes.io/name: worker-cover-letter
    app.kubernetes.io/component: worker
spec:
  replicas: 1
  selector:
    matchLabels:
      app: worker-cover-letter
  template:
    metadata:
      labels:
        app: worker-cover-letter
    spec:
      containers:
        - name: worker-cover-letter
          image: analizzatore-registry.localhost:5000/worker-cover-letter:latest
          imagePullPolicy: Always
          envFrom:
            - configMapRef:
                name: app-config
            - secretRef:
                name: app-secrets
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
